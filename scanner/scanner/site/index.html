<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1322"><title>Futures AI Scanner</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1322;color:#f1f5f9;font:15px Tahoma,Arial,sans-serif}main{max-width:1080px;margin:auto;padding:22px}h1{color:#d9b369;font-size:clamp(26px,5vw,42px);margin-bottom:4px}.muted{color:#a7b4c8}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.stat,.card{background:#172237;border:1px solid #2d3c55;border-radius:13px;padding:16px}.stat b{display:block;margin-top:8px;font-size:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}button{background:#d9b369;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;color:#101827}.long{color:#4ade80}.short{color:#fb7185}.head,.line{display:flex;justify-content:space-between;gap:10px}.head{align-items:center;margin-bottom:15px}.line{border-top:1px solid #2d3c55;padding:10px 0;font-size:13px}.line span{color:#9eacc2}small{color:#a7b4c8}.warn{padding:13px;border:1px solid #735b2d;border-radius:9px;color:#e9cf9e;margin-top:22px}.empty{padding:30px;text-align:center;border:1px dashed #41506a;border-radius:12px}
</style></head><body><main><div class="toolbar"><div><h1>Futures AI Scanner</h1><p class="muted">Binance USDT-M · Scalping · إشارات تحليلية فقط</p></div><button id="refresh">تحديث العرض</button></div><section class="stats"><div class="stat"><small>العقود المفحوصة</small><b id="scanned">—</b></div><div class="stat"><small>الفرص المطابقة</small><b id="matched">—</b></div><div class="stat"><small>عمر البيانات</small><b id="age">—</b></div></section><p id="status" class="muted">جارٍ تحميل آخر نتائج الفحص...</p><section class="cards" id="cards"></section><p class="warn">⚠️ هذه إشارات بحثية غير مختبرة، وليست توصيات مضمونة. الأرقام مرجعية عند إغلاق الشمعة، ولا تشمل رسوم التداول أو السبريد أو الانزلاق. لا توجد أوامر تداول.</p></main><script>
const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('en-US',{maximumSignificantDigits:8});function line(label,value){const row=document.createElement('div');row.className='line';const a=document.createElement('span');a.textContent=label;const b=document.createElement('b');b.textContent=value;row.append(a,b);return row}async function load(){try{const r=await fetch('./data/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();$('scanned').textContent=d.scanned??'—';$('matched').textContent=d.matched??'—';const age=d.generatedAt?Math.max(0,Math.floor((Date.now()-Date.parse(d.generatedAt))/60000)):null;$('age').textContent=age===null?'—':age+' دقيقة';$('status').textContent=d.generatedAt?'آخر فحص: '+new Date(d.generatedAt).toLocaleString('ar-EG'):'لم يتم تشغيل فحص فعلي حتى الآن';if(age!==null&&age>45)$('status').textContent+=' — تحذير: البيانات قديمة';const root=$('cards');root.replaceChildren();for(const x of d.opportunities||[]){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='head';const symbol=document.createElement('strong');symbol.textContent=x.symbol;const side=document.createElement('b');side.className=x.side==='LONG'?'long':'short';side.textContent=x.side;head.append(symbol,side);card.append(head,line('التقييم الفني',x.score+'/100'),line('دخول مرجعي',fmt(x.entry)),line('وقف نظري',fmt(x.stop)),line('هدف نظري',fmt(x.takeProfit)),line('العائد/المخاطرة الإجمالي','1:'+x.rrGross),line('RSI',x.rsi),line('حجم نسبي',x.volumeRatio),line('وقت إغلاق شمعة الدخول',new Date(x.candleClose).toLocaleString('ar-EG')));root.append(card)}if(!root.children.length){const p=document.createElement('p');p.className='empty';p.textContent=d.generatedAt?'لا توجد فرص مطابقة في آخر فحص.':'في انتظار أول فحص حقيقي.';root.append(p)}}catch(e){$('status').textContent='تعذر تحميل البيانات: '+e.message}}$('refresh').onclick=load;load();
</script></body></html>
